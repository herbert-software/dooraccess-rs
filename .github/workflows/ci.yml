name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  OPENWRT_SDK_VER: "24.10.1"

jobs:
  check:
    name: check (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install stable toolchain
        run: rustup component add rustfmt clippy
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --release -- -D warnings
      - name: build (host)
        run: cargo build --release
      - name: test (host)
        run: cargo test
      - name: run host probe
        run: ./target/release/dooraccess-rs-probe

  mips-build:
    name: cross-build MIPS BE soft-float
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install nightly + rust-src + llvm-tools
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src llvm-tools-preview --toolchain nightly
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Cache OpenWrt SDK sysroot
        uses: actions/cache@v5
        with:
          path: .openwrt-sdk
          key: openwrt-sdk-${{ env.OPENWRT_SDK_VER }}-ath79-mips_24kc
      - name: Fetch SDK sysroot
        run: make fetch-sdk
      - name: Cross-build static MIPS probe
        run: make build-mips
      - name: Verify MIPS BE + soft-float + static
        run: make verify-mips
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dooraccess-rs-probe-mips
          path: target/mips-unknown-linux-musl/release/dooraccess-rs-probe

  # ── BE 第二层防御：编译期 #[cfg(target_endian="big")] const 断言（port-rust-listeners-unlock, task 9.1）─
  # 认证 BE 寄存器/端序行为 + struct 字段宽度（htons no-op、from_be_bytes、mips32
  # tv_sec/sll_ifindex/sock_filter 宽度）。**落点 = 上面的 `cross-build MIPS BE soft-float` job**：
  # 它 `make build-mips` 编译 ffi.rs 时，`#[cfg(target_endian="big")] const _: () = assert!(...)`
  # 由 const-eval 按 mips BE 目标端序求值——htons 写错（如 `v<<8|v>>8`）或 struct 宽度分叉会
  # **编译期失败**，故该 job 通过即认证 BE layer-2。这是 spec「大端三层防御」明列的 fallback。
  #
  # 曾尝试 qemu-mips user-mode 跑 runtime 单测作 layer-2，但 cross-test 二进制需 build-mips 的
  # 静态 musl sysroot + link-mips.sh wrapper（默认 cc/-pie/动态链接在 CI 无 mips musl 动态库 →
  # 链接失败），且 qemu-user 下线程/TCP/timing 单测不稳；而其核心保证（htons/struct）已由上述
  # 编译期 const 断言在 cross-build job 强制，故移除 runtime qemu job、采编译期断言（见 PHASE3.md）。
  #
  # ★PF_PACKET socket-level BE（sll_protocol NBO）：qemu-user 把 syscall 透传宿主 LE 内核，
  #   结构性不可在 CI 认证——留姊妹变更 `verify-rust-listeners-on-hap` 上真 hAP（DEPLOY.md S1-S12）。

  # ── golden 向量漂移门（port-rust-protocol-core, tasks 2.5 / 方案②）─────────
  # 机械门（✅ 已接通生效 2026-06-08）：跨仓 checkout 私有 dooraccess-go → setup-go
  # → 重新跑 export → 与 committed testdata/golden/ 逐字节 diff，不一致即 fail。防 Go
  # daemon 改了 wire/schema 后 Rust 继续对旧向量假绿。主分支 push 实跑通过（见 PHASE1.md §5）。
  #
  # 依赖 secret `DOORACCESS_GO_TOKEN`（对私有 herbert-software/dooraccess-go 有 Contents:Read
  # 的细粒度 PAT），已配置。若该 secret 失效/移除，本 job 会因跨仓 checkout 失败而 fail，
  # 即漂移门退化为「未接通」——此时须重配 secret，不可当作向量已对齐。
  golden-drift:
    name: golden vector drift gate (committed == current Go)
    runs-on: ubuntu-latest
    # Dependabot PR 跑在受限 secret 上下文，拿不到 DOORACCESS_GO_TOKEN（跨仓 checkout 必失败）；
    # 且 dependabot 只升级 action 版本、永不改 golden 向量，漂移门对它无意义 → 跳过。
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout dooraccess-rs (golden vectors)
        uses: actions/checkout@v6
        with:
          path: dooraccess-rs
      - name: Checkout private dooraccess-go
        uses: actions/checkout@v6
        with:
          repository: herbert-software/dooraccess-go
          token: ${{ secrets.DOORACCESS_GO_TOKEN }}
          path: dooraccess-go
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Re-export golden from current Go
        working-directory: dooraccess-go
        env:
          DOORACCESS_GOLDEN_DIR: ${{ github.workspace }}/_fresh-golden
        run: |
          mkdir -p "$DOORACCESS_GOLDEN_DIR"
          # listen6672 / listen18022 含 linux-only export（extractUDPPayload/extractTCPPayload，
          # `//go:build linux && export`）——CI runner 是 ubuntu(linux)，原生编译跑得到。
          for pkg in codec wire18022 config automationstate http8080 listen6672 listen18022; do
            go test -tags export -run ExportGolden ./internal/$pkg/
          done
      - name: Diff committed golden vs fresh Go export
        run: |
          # 只比对导出测试生成的向量文件（EXCEPTIONS.md 是手写文档，不参与漂移 diff）
          # listener/BPF/sender 向量（组 E，task 8.4）：bpf.txt（6672+18022 双写互验）+
          # listen{6672,18022}.txt（parser/classify/numquery）+ listen{6672,18022}_extract.txt
          # （linux-only extract）+ wire_sender.txt（sender 帧 + 错误分类）。
          for f in bcd.txt uri.txt wire.txt config.txt results.txt automation_state.txt \
                   bpf.txt listen6672.txt listen6672_extract.txt \
                   listen18022.txt listen18022_extract.txt wire_sender.txt; do
            diff -u "dooraccess-rs/testdata/golden/$f" "_fresh-golden/$f" \
              || { echo "::error::golden 向量漂移：committed $f 与当前 Go 输出不一致"; exit 1; }
          done
          for f in parser.txt endpoint_body.txt endpoint_socket.txt middleware.txt hapush.txt mux404.txt; do
            diff -u "dooraccess-rs/testdata/golden/http/$f" "_fresh-golden/http/$f" \
              || { echo "::error::golden HTTP 向量漂移：committed http/$f 与当前 Go 输出不一致"; exit 1; }
          done
          echo "✓ committed golden 向量与当前 Go 输出逐字节一致"
